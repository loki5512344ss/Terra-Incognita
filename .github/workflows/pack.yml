# Builds the Incognita mod, the pack zip in CurseForge format and the dedicated-server zip.
#  - push to main and pull requests: the zip is kept in the run artifacts (30 days)
#  - tag like v1.2.3: also creates a GitHub release with this zip and the mod jar on its own
name: pack

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags are needed: the pack version is derived from them

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test the Incognita mod
        run: script/build-mod.sh

      - name: Build the CurseForge pack and the server pack
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 script/build-cf-pack.py --with-server --version "${GITHUB_REF_NAME#v}"
          else
            python3 script/build-cf-pack.py --with-server
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TerraIncognita-curseforge
          path: |
            dist/*-curseforge.zip
            dist/*-server.zip
            custom_mods/incognita/build/libs/incognita-*.jar
            !custom_mods/incognita/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a tag with a suffix (v0.1.0-alpha.1, v0.2.0-beta.3) is published as a pre-release
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          # besides the pack zip, attach the Incognita jar on its own (inside the zip it lives in overrides/mods)
          jar=$(find custom_mods/incognita/build/libs -maxdepth 1 -name 'incognita-*.jar' ! -name '*sources*' | sort | tail -1)
          gh release create "$GITHUB_REF_NAME" dist/*-curseforge.zip dist/*-server.zip "$jar" \
            --title "Terra Incognita ${GITHUB_REF_NAME#v}" --generate-notes "${flags[@]}"
