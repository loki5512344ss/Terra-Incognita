#Rare dense fog: a weather event that rolls in for a few minutes
enabled = true
#Strongest fog density, 0 to 1
# Default: 0.9
# Range: 0.0 ~ 1.0
maxIntensity = 0.9
#Visibility in blocks at the densest fog
# Default: 12
# Range: 2 ~ 256
minDistance = 12
#How often fog happens (1 = about once per 8 game days, higher = more often)
# Default: 1.0
# Range: 0.1 ~ 10.0
frequency = 1.0
#A fog that happens around sunrise is thicker
morningFog = true

[clouds]
	#Volumetric clouds; false shows no clouds at all (the vanilla clouds are always off)
	enabled = true
	#Blocks added to the dimension cloud height (192); 60 puts the cumulus base at Y 252, altocumulus at ~402 and cirrus at ~562
	# Default: 60.0
	# Range: -128.0 ~ 512.0
	cloudBaseOffset = 60.0
	#Opacity of a dense cloud core, 0 to 1 (edges stay soft, rain makes clouds denser)
	# Default: 0.9
	# Range: 0.2 ~ 1.0
	density = 0.9
	#How far clouds are generated and drawn, in blocks
	# Default: 1024
	# Range: 256 ~ 2048
	drawDistance = 1024
	#Render the cloud passes at half resolution (much cheaper, edges stay smooth)
	halfResolution = true
	#Use the OpenGL 3.3 code path even when OpenGL 4.3 is available (for testing)
	forceLegacyPath = false

[sky]
	#Custom procedural sky; false keeps the vanilla sky (for example with a sky mod)
	enabled = true
	#How many stars are drawn at night (1 = default, 0 = none)
	# Default: 1.0
	# Range: 0.0 ~ 3.0
	starDensity = 1.0
	#Thickness of the horizon haze in clear weather (1 = default, 0 = crisp horizon)
	# Default: 1.0
	# Range: 0.0 ~ 2.0
	hazeStrength = 1.0

[precipitation]
	#Wind blown rain and snow with splashes and roof occlusion; false falls back to the vanilla weather
	enabled = true
	#Particle density, 1 = default
	# Default: 1.0
	# Range: 0.1 ~ 3.0
	density = 1.0
